[project]
name = "catalogue"
version = "0.1.0"
description = "Data catalogue API with AI-assisted curation"
requires-python = ">=3.14,<3.15"
dependencies = [
    "anthropic>=2.3,<3",
    "fastapi>=0.162,<0.163",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "uvicorn[standard]>=0.54,<0.55",
]

[project.scripts]
catalogue-openapi = "catalogue.app:export_openapi"

[dependency-groups]
dev = [
    "httpx2>=2.16,<3",
    "hypothesis>=6.170,<7",
    "import-linter>=2.15,<3",
    "mypy>=2.4,<3",
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
    "ruff>=0.17.2,<0.18",
    "schemathesis>=4.32,<5",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "A", "C4", "SIM", "RET", "PTH", "PL", "RUF",
    "ASYNC", "FAST", "PT", "TRY", "ERA", "T20", "DTZ", "LOG", "G", "ARG", "BLE",
]
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
enable_error_code = [
    "deprecated",
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "possibly-undefined",
]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest]
strict = true
testpaths = ["tests"]
addopts = ["-ra"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["catalogue"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "^\\s*\\.\\.\\.$"]

[tool.importlinter]
root_package = "catalogue"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: app > api > services > curation | repositories > domain > core"
type = "layers"
layers = [
    "catalogue.app",
    "catalogue.api",
    "catalogue.services",
    "catalogue.curation | catalogue.repositories",
    "catalogue.domain",
    "catalogue.core",
]

[[tool.importlinter.contracts]]
name = "Only api and app use FastAPI or Starlette"
type = "forbidden"
source_modules = [
    "catalogue.services",
    "catalogue.curation",
    "catalogue.repositories",
    "catalogue.domain",
    "catalogue.core",
]
forbidden_modules = ["fastapi", "starlette"]

[[tool.importlinter.contracts]]
name = "Only curation uses the Anthropic SDK"
type = "forbidden"
source_modules = [
    "catalogue.app",
    "catalogue.api",
    "catalogue.services",
    "catalogue.repositories",
    "catalogue.domain",
    "catalogue.core",
]
forbidden_modules = ["anthropic"]

[[tool.importlinter.contracts]]
name = "Domain has no framework imports"
type = "forbidden"
source_modules = ["catalogue.domain"]
forbidden_modules = ["pydantic", "pydantic_settings"]
