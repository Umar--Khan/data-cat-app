name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every uv command fails if backend/uv.lock is out of date with pyproject.toml.
  UV_LOCKED: '1'

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm check:api

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          python: 'false'
      - run: pnpm --filter frontend exec playwright install --with-deps --only-shell chromium
      - run: pnpm check:web
      - run: pnpm --filter frontend build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # The suite runs headless, so the headless shell is all it needs.
      - run: pnpm --filter frontend exec playwright install --with-deps --only-shell chromium
      - run: pnpm verify:api
      - run: pnpm verify:api --degraded
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
