name: Set up toolchain
description: Installs pnpm and Node, and uv unless python is 'false', with caches, then the workspaces' dependencies.

inputs:
  python:
    description: Also install uv and the backend environment.
    default: 'true'

runs:
  using: composite
  steps:
    # No version input: the action reads it from packageManager in package.json.
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm

    # setup-uv publishes no floating major tag, so it is pinned to an exact release. uv itself is
    # pinned too, to the release the local toolchain and uv_build's <0.13 bound expect.
    - uses: astral-sh/setup-uv@v10.3.2
      if: inputs.python == 'true'
      with:
        version: '0.12.19'
        enable-cache: true
        cache-dependency-glob: backend/uv.lock

    - run: pnpm install --frozen-lockfile
      shell: bash

    - run: uv sync --directory backend
      if: inputs.python == 'true'
      shell: bash
